<style>
  :root{--ink:#1d2433;--muted:#5b6475;--line:#e3e7ee;--bg:#f5f7fb;--card:#ffffff}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
  .wrap{max-width:520px;margin:0 auto;padding:14px}
  .mgr{position:absolute;top:16px;right:16px;text-align:right;line-height:1.25}
  .mgr span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .mgr strong{display:block;font-size:14px;color:var(--ink)}
  header{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .logo{position:absolute;top:16px;left:16px;display:block;height:40px;width:auto;max-width:45%;object-fit:contain;object-position:left center;margin:0}
  header{text-align:center;padding-top:72px}
  header h1{text-wrap:balance}
  .mgr{top:12px;right:14px;display:flex;align-items:center;gap:10px}
  .mgr-ph{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.22);flex:none}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .qr-btn{margin-top:12px;display:inline-block;background:#1d2433;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer}
  #qr-panel{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px;text-align:center}
  #qr-panel.open{display:block}
  #qr-box{display:inline-block;background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line)}
  #qr-box img,#qr-box canvas{display:block}
  .qr-note{color:var(--muted);font-size:13px;margin-top:8px}
  #map{height:280px;border-radius:14px;border:1px solid var(--line);margin-bottom:12px;z-index:0}
  .tip{background:#fff;border:0;box-shadow:none;font-weight:700;font-size:12px;color:#1d2433;padding:0;background:transparent}
  .crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:14px}
  .crumbs button{background:none;border:0;color:#2c3e9e;font-size:14px;cursor:pointer;padding:4px 2px;text-decoration:underline}
  .crumbs span{color:var(--muted)}
  .back{display:inline-block;background:#1d2433;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;margin:0 0 12px}
  h2{font-size:17px;margin:6px 0 10px;text-align:center}
  #view > .sub{text-align:center}
  .grid{display:grid;grid-template-columns:minmax(220px,50%);justify-content:center;gap:10px}
  .btn:hover{box-shadow:0 4px 10px rgba(20,30,50,.22),0 1px 3px rgba(20,30,50,.14)}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(20,30,50,.18)}
  .btn{transition:box-shadow .15s,transform .1s;box-shadow:0 3px 8px rgba(20,30,50,.16),0 1px 2px rgba(20,30,50,.12);color:#fff;border:2px solid #cfd4dc;border-radius:12px;padding:14px 12px;font-size:15px;font-weight:700;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;width:100%}
  .btn .lbl{display:inline-flex;align-items:center;gap:8px;max-width:100%;background:#000;padding:3px 8px;border-radius:8px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .btn .nm{min-width:0}
  .btn .ct{flex:none;background:#fff;color:#000;font-size:12px;font-weight:800;min-width:22px;height:22px;padding:0 6px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;text-shadow:none;font-variant-numeric:tabular-nums}
  .btn small{font-weight:600;opacity:.92;font-size:12px;white-space:nowrap}
  .btn:focus-visible,.qr-btn:focus-visible,.back:focus-visible,.crumbs button:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
  .card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,#1d2433);border-radius:12px;padding:14px;margin-bottom:10px}
  .card h3{font-size:16px;margin:0 0 4px}
  .card .addr{color:var(--muted);font-size:14px;margin:0 0 10px}
  .card .tel{font-size:14px;margin:0 0 10px;color:var(--ink)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .act{flex:1 1 150px;text-align:center;text-decoration:none;border-radius:10px;padding:11px 12px;font-weight:700;font-size:15px;color:#fff}
  .act.map{background:#2c3e9e}
  .act.call{background:#1b7f3b}
  .copy{margin-left:6px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
  .num{font-variant-numeric:tabular-nums;user-select:all}
  .empty{color:var(--muted);padding:14px;background:#fff;border:1px dashed var(--line);border-radius:12px}
  footer{color:var(--muted);font-size:12px;text-align:center;margin:18px 0 8px}
</style>

    case "h": return `repeating-linear-gradient(to bottom, ${a} 0 9px, ${b} 9px 18px)`;
    case "v": return `repeating-linear-gradient(to right, ${a} 0 9px, ${b} 9px 18px)`;
    case "d": return `repeating-linear-gradient(45deg, ${a} 0 9px, ${b} 9px 18px)`;
    case "hsplit": return `linear-gradient(to bottom, ${a} 50%, ${b} 50%)`;
    case "vsplit": return `linear-gradient(to right, ${a} 50%, ${b} 50%)`;
    default: return a;
  }
}
const tr = (a,b) => a.localeCompare(b, "tr");
const count = arr => arr.length;
const uniq = arr => [...new Set(arr)].sort(tr);

/* ---------- Gezinme ---------- */
function selectProvince(il){ state.il = il; state.ilce = null; state.mahalle = null; go(); }
function selectIlce(ilce){ state.ilce = ilce; state.mahalle = null; go(); }
function selectMahalle(m){ state.mahalle = m; go(); }
function goBack(){
  if (state.mahalle) state.mahalle = null;
  else if (state.ilce) state.ilce = null;
  else state.il = null;
  go();
}
function reset(){ state.il = null; state.ilce = null; state.mahalle = null; go(); }

function go(){
  render();
}

function btnStyle(il){ return `background:${fillOf(il)};`; }
function buttonGrid(items, ilKey){
  return `<div class="grid">` + items.map(it =>
    `<button class="btn" style="${btnStyle(ilKey ? ilKey : it.v)}" data-val="${esc(it.v)}" data-type="${it.t}">
       <span class="lbl"><span class="nm">${esc(it.label)}</span><span class="ct">${it.count}</span></span>
     </button>`).join("") + `</div>`;
}

function render(){
  renderBody();
  if (state.il){
    const b = document.createElement("button");
    b.className = "back"; b.textContent = "← Geri";
    b.addEventListener("click", goBack);
    $("view").prepend(b);
  }
}
function renderBody(){
  const view = $("view");

  if (!state.il){
    const ORDER = ["Bursa","Balıkesir","Sakarya","Çanakkale","Yalova","Bolu","Kocaeli","Bilecik"];
    const provs = ORDER.filter(il => PROVINCES[il]);
    const items = provs.map(il => ({v:il, t:"il", label:il, count:DATA.filter(d=>d.il===il).length}));
    view.innerHTML = `<h2>Makine bulunan iller</h2>
      <p class="sub" style="margin:0 0 10px">İl seçin.</p>` +
      buttonGrid(items, null);
    // her ile kendi rengi
    
    bindButtons(view);
    return;
  }

  if (!state.ilce){
    const rows = DATA.filter(d => d.il === state.il);
    const ilceler = uniq(rows.map(d => d.ilce));
    const items = ilceler.map(ilce => ({v:ilce, t:"ilce", label:ilce, count: count(rows.filter(d=>d.ilce===ilce))}));
    view.innerHTML = `<h2>${esc(state.il)} · İlçeler</h2>` + buttonGrid(items, state.il);
    bindButtons(view);
    return;
  }

  if (!state.mahalle){
    const rows = DATA.filter(d => d.il === state.il && d.ilce === state.ilce);
    const mahalleler = uniq(rows.map(d => d.mahalle));
    const items = mahalleler.map(m => ({v:m, t:"mahalle", label:m, count: count(rows.filter(d=>d.mahalle===m))}));
    view.innerHTML = `<h2>${esc(state.ilce)} · Mahalleler</h2>` + buttonGrid(items, state.il);
    bindButtons(view);
    return;
  }

  const list = DATA.filter(d => d.il === state.il && d.ilce === state.ilce && d.mahalle === state.mahalle);
  const c = col(state.il);
  view.innerHTML = `<h2>${esc(state.mahalle)} · ${list.length} eczane</h2>` + (list.length ? list.map(d => {
    const q = encodeURIComponent(`${d.ad}, ${d.adres}`);
    return `<article class="card" style="--c:${c}">
      <h3>${esc(d.ad)}</h3>
      <p class="addr">${esc(d.adres)}</p>
      <p class="tel">Telefon: <span class="num">${esc(d.tel)}</span> <button class="copy" data-num="${esc(d.tel)}">Kopyala</button></p>
      <div class="actions">
        <a class="act map" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener noreferrer">Haritada aç</a>
        <a class="act call" href="tel:${esc(d.tel_link)}">Ara</a>
      </div>
    </article>`;
  }).join("") : `<div class="empty">Bu mahallede kayıtlı eczane bulunamadı.</div>`);
  bindButtons(view);
}

function bindButtons(root){
  root.querySelectorAll(".btn").forEach(b => {
    b.addEventListener("click", () => {
      const v = b.dataset.val, t = b.dataset.type;
      if (t === "il") selectProvince(v);
      else if (t === "ilce") selectIlce(v);
      else if (t === "mahalle") selectMahalle(v);
    });
  });
}

$("view").addEventListener("click", e => {
  const b = e.target.closest("button.copy"); if (!b) return;
  const n = b.dataset.num;
  const done = () => { b.textContent = "Kopyalandı"; };
  try { navigator.clipboard.writeText(n).then(done, () => { b.textContent = n; }); } catch(_) { b.textContent = n; }
});

/* ---------- QR ---------- */
$("qr-toggle").addEventListener("click", () => {
  const panel = $("qr-panel");
  const open = !panel.classList.contains("open");
  panel.classList.toggle("open", open);
  $("qr-toggle").setAttribute("aria-expanded", String(open));
  $("qr-toggle").textContent = open ? "QR kodu gizle" : "QR için tıklayın";
});

render();
</script>
</body>
</html>
